<div class="flex align-items-center gap-2 mb-3">
  <input pInputText type="text" placeholder="search log body..." [(ngModel)]="query" (keydown.enter)="search()" />
  <button pButton label="Search" (click)="search()"></button>
</div>

<p-table [value]="logs" [loading]="loading" [rowHover]="true">
  <ng-template pTemplate="header">
    <tr>
      <th>Time</th>
      <th>Severity</th>
      <th>Service</th>
      <th>Message</th>
      <th>Trace</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr (click)="openTrace(row.traceId)">
      <td>{{ fmtTime(row.timestamp) }}</td>
      <td [class]="'severity-' + row.severity">{{ row.severity }}</td>
      <td>{{ row.service }}</td>
      <td>{{ row.body }}</td>
      <td>{{ row.traceId ? row.traceId.slice(0, 8) : '' }}</td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr><td colspan="5" class="hint">No logs found.</td></tr>
  </ng-template>
</p-table>
