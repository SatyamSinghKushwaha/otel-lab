<div class="flex align-items-center gap-3 mb-3">
  <label class="hint">Metric
    <p-dropdown [options]="names" [(ngModel)]="activeMetric" (onChange)="loadData()" styleClass="ml-2"></p-dropdown>
  </label>
</div>

<p-chart *ngIf="chartData" type="line" [data]="chartData" [options]="chartOptions" height="320px"></p-chart>
<p class="hint" *ngIf="!chartData">No data points for this metric yet.</p>

<p-table [value]="recentPointsDesc()">
  <ng-template pTemplate="header">
    <tr>
      <th>Time</th>
      <th>Value</th>
      <th>Service</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ fmtTime(row.timestamp) }}</td>
      <td>{{ row.value }}</td>
      <td>{{ row.service }}</td>
    </tr>
  </ng-template>
</p-table>
